line-length = 100
target-version = "py39"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E402",  # GTK requires gi.require_version() before the imports
    "E741",  # single-letter names are fine in the maths helpers
]

[lint.per-file-ignores]
"prayertimes/indicator.py" = ["E731"]  # small lambda helpers keep the layout code short
"tests/*" = ["E731"]
